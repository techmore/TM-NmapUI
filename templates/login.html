<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NmapUI Sign In</title>
  <link rel="stylesheet" href="/static/vendor/fonts.css" />
  <style>
    /* Olive web palette (scripts/ui-assets/tailwind.config.cjs olive-50..950). */
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: oklch(91% 0.012 106.5); color: oklch(15.3% 0.006 107.1);
      font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(92vw, 360px); background: #fff; border: 1px solid oklch(85% 0.028 110);
      border-radius: 16px; padding: 28px; box-shadow: 0 18px 40px oklch(22% 0.025 110 / .12);
    }
    h1 { margin: 0 0 4px; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 32px; color: oklch(16% 0.015 110); }
    p.sub { margin: 0 0 20px; font-size: 13px; color: oklch(42% 0.055 110); }
    label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: oklch(35% 0.045 110); margin: 14px 0 6px; }
    input {
      width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px;
      border: 2px solid oklch(91% 0.020 110); background: oklch(96% 0.015 110); color: oklch(22% 0.025 110); font-size: 14px;
    }
    input:focus { outline: none; background: #fff; border-color: oklch(50% 0.065 110); box-shadow: 0 0 0 3px oklch(75% 0.040 110 / .45); }
    button {
      width: 100%; margin-top: 20px; padding: 11px 12px; border: 0; border-radius: 10px;
      background: oklch(42% 0.055 110); color: white; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: oklch(35% 0.045 110); }
    button:focus-visible { outline: 2px solid oklch(28% 0.035 110); outline-offset: 2px; }
    .error {
      margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
    }
    .note { margin-top: 18px; font-size: 12px; color: oklch(42% 0.055 110); }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>NmapUI</h1>
    <p class="sub">Sign in once — this device stays signed in.</p>

    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autofocus required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit">Sign in</button>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <p class="note">Credentials come from NMAPUI_USERNAME / NMAPUI_PASSWORD.</p>
  </form>
</body>
</html>
