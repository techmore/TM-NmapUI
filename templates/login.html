<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NmapUI Sign In</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #0f172a; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(92vw, 360px); background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; padding: 28px; box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.sub { margin: 0 0 20px; font-size: 13px; color: #94a3b8; }
    label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #94a3b8; margin: 14px 0 6px; }
    input {
      width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 14px;
    }
    button {
      width: 100%; margin-top: 20px; padding: 11px 12px; border: 0; border-radius: 8px;
      background: #2563eb; color: white; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .error {
      margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
      background: rgba(220,38,38,.15); border: 1px solid rgba(220,38,38,.4); color: #fca5a5;
    }
    .note { margin-top: 18px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>NmapUI</h1>
    <p class="sub">Sign in once — this device stays signed in.</p>

    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autofocus required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit">Sign in</button>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <p class="note">Credentials come from NMAPUI_USERNAME / NMAPUI_PASSWORD.</p>
  </form>
</body>
</html>
