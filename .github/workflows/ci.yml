name: CI

on:
  push:
    branches:
      - main
      - dev
      - swift-native
  pull_request:
  workflow_dispatch:

# Feature branches run through their PR, including drafts. Avoid starting a
# second full matrix on every feature push; dispatch supports pre-PR checks.
# New revisions still supersede obsolete runs for the same source branch.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit And Contract Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Retry stalled apt downloads
        # Config file, so apt calls made by other tools (playwright --with-deps) retry too.
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y xsltproc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/ui-assets/package-lock.json
      - name: Verify committed browser assets are reproducible
        run: |
          npm ci --prefix scripts/ui-assets
          npm run build --prefix scripts/ui-assets
          git diff --exit-code -- static/css/tailwind.css static/vendor
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit JavaScript lockfiles
        run: |
          npm audit --package-lock-only
          npm audit --package-lock-only --prefix scripts/ui-assets
      - name: Run unit and contract suite
        run: pytest -q
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

  browser-regressions:
    name: Browser Regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NMAPUI_RUN_BROWSER_REGRESSION: "1"
      NMAPUI_SOCKET_AUTH_DISABLED: "1"
      NMAPUI_TRUST_LOCAL_UI: "true"
      NMAPUI_ALLOW_UNSAFE_WERKZEUG: "true"
      NMAPUI_DEBUG: "false"
      NMAPUI_ENABLE_NETWORK_FINGERPRINT: "false"
      NMAPUI_ENABLE_UPDATE_CHECK: "false"
      NMAPUI_ENABLE_VULNERS: "false"
    steps:
      - uses: actions/checkout@v5
      - name: Retry stalled apt downloads
        # Config file, so apt calls made by other tools (playwright --with-deps) retry too.
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install report transformation dependency
        run: sudo apt-get update && sudo apt-get install -y xsltproc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser regression suite
        run: >-
          pytest -q tests/test_browser_regressions.py
          tests/test_history_modal_state.py::test_archive_failed_refresh_keeps_saved_cards_and_retry_recovers_in_chromium
          tests/test_reporting_modules.py::test_pdf_renderer_blocks_external_scripts
          tests/test_reporting_modules.py::test_representative_report_fixture_renders_shared_landmarks_for_web_and_pdf
      - name: Upload browser regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics
          path: |
            logs
            data
            .pytest_cache
          if-no-files-found: ignore

  ubuntu-production-smoke:
    name: Ubuntu Service And WebSocket Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NMAPUI_RUN_PRODUCTION_SMOKE: "1"
      NMAPUI_RUN_STAGED_SMOKE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Retry stalled apt downloads
        # Config file, so apt calls made by other tools (playwright --with-deps) retry too.
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install scanner and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-venv nmap arp-scan xsltproc traceroute
          # Hosted images make /usr/share writable for their tooling. A root
          # scanner must not load scripts through a writable parent directory.
          sudo chown root:root /usr/share /opt /usr/local /usr/local/bin
          sudo chmod go-w /usr/share /opt /usr/local /usr/local/bin
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Validate service artifacts and staged server
        run: |
          packaging/ubuntu/install-service.sh --dry-run
          unit_file="$(mktemp --suffix=.service)"
          bash -c 'unit_file="$1"; set --; source packaging/ubuntu/install-service.sh; WRAPPER_PATH=/bin/true; CURRENT_LINK=/; CREDENTIALS_FILE=/etc/os-release; DATA_DIR=/tmp; LOG_DIR=/tmp; build_unit "$unit_file"' _ "$unit_file"
          systemd-analyze verify "$unit_file"
          rm -f "$unit_file"
          .venv/bin/python -m pytest -q tests/test_ubuntu_installer.py tests/test_stage_runtime.py tests/test_runtime_file_migration.py tests/test_production_server.py
          sudo env NMAPUI_RUN_PRIVILEGED_SCAN_SMOKE=1 .venv/bin/python -m pytest -q tests/test_production_server.py::test_root_nmap_syn_scan_is_available_on_loopback
      - name: Install system dependencies for the supervised service
        run: sudo .venv/bin/python -m playwright install-deps chromium
      - name: Exercise the installed systemd lifecycle
        run: |
          set -euo pipefail
          wait_ready() {
            local release="$1"
            for _ in $(seq 1 45); do
              if sudo .venv/bin/python packaging/check_release_ready.py --release "$release" --port 9000; then
                return 0
              fi
              sleep 1
            done
            sudo journalctl -u nmapui.service --no-pager -n 80
            return 1
          }

          sudo packaging/ubuntu/install-service.sh
          current_release="$(readlink -f /opt/nmapui/current)"
          wait_ready "$current_release"
          sudo systemctl is-active --quiet nmapui.service
          sudo systemctl is-enabled --quiet nmapui.service
          test "$(sudo stat -c '%a:%U:%G' /etc/nmapui/nmapui.env)" = "600:root:root"
          test "$(sudo stat -c '%a:%U:%G' /var/lib/nmapui)" = "700:root:root"
          test "$(sudo stat -c '%a:%U:%G' /var/log/nmapui)" = "700:root:root"
          test "$(sudo stat -c '%a:%U:%G' "$current_release")" = "755:root:root"
          test "$(sudo stat -c '%a:%U:%G' "$current_release/app.py")" = "644:root:root"
          test "$(sudo stat -c '%a:%U:%G' "$current_release/privileged-assets")" = "755:root:root"
          sudo ss -ltnH 'sport = :9000' | grep -Eq '127\.0\.0\.1:9000'

          smoke_password="$(openssl rand -hex 24)"
          sudo sed -i \
            -e 's/^NMAPUI_USERNAME=.*/NMAPUI_USERNAME=ci-smoke/' \
            -e "s/^NMAPUI_PASSWORD=.*/NMAPUI_PASSWORD=${smoke_password}/" \
            /etc/nmapui/nmapui.env
          sudo sh -c 'echo "NMAPUI_TRUST_LOCAL_UI=false" >> /etc/nmapui/nmapui.env'
          sudo systemctl restart nmapui.service
          wait_ready "$current_release"
          sudo env \
            PLAYWRIGHT_BROWSERS_PATH=/opt/nmapui/playwright-browsers \
            NMAPUI_RUN_BROWSER_REGRESSION=1 \
            .venv/bin/python -m pytest -q \
            tests/test_reporting_modules.py::test_pdf_renderer_blocks_external_scripts
          sudo env \
            PLAYWRIGHT_BROWSERS_PATH=/opt/nmapui/playwright-browsers \
            NMAPUI_TEST_INSTALLED_SERVICE_URL=http://127.0.0.1:9000 \
            NMAPUI_TEST_INSTALLED_SERVICE_USERNAME=ci-smoke \
            NMAPUI_TEST_INSTALLED_SERVICE_PASSWORD="$smoke_password" \
            .venv/bin/python -m pytest -q \
            tests/test_production_server.py::test_installed_service_requires_session_and_accepts_websocket

          sudo systemctl stop nmapui.service
          if sudo systemctl is-active --quiet nmapui.service; then
            echo "NmapUI remained active after systemctl stop" >&2
            exit 1
          fi
          sudo systemctl start nmapui.service
          wait_ready "$current_release"

          sudo .venv/bin/python -c 'from nmapui.runtime_db import create_runtime_state_store; create_runtime_state_store("/var/lib/nmapui/runtime.sqlite3").upsert_job(job_id="ci-interrupted-job", owner_sid="ci-smoke", job_type="scan", status="running", payload={"target":"127.0.0.1"})'
          old_main="$(sudo systemctl show --property=MainPID --value nmapui.service)"
          sudo systemctl kill --kill-whom=main --signal=SIGKILL nmapui.service
          restarted=false
          for _ in $(seq 1 45); do
            new_main="$(sudo systemctl show --property=MainPID --value nmapui.service)"
            if sudo systemctl is-active --quiet nmapui.service \
              && [[ "$new_main" != 0 && "$new_main" != "$old_main" ]] \
              && sudo .venv/bin/python packaging/check_release_ready.py --release "$current_release" --port 9000; then
              restarted=true
              break
            fi
            sleep 1
          done
          test "$restarted" = true
          sudo .venv/bin/python -c 'from nmapui.runtime_db import create_runtime_state_store; job=create_runtime_state_store("/var/lib/nmapui/runtime.sqlite3").get_job("ci-interrupted-job"); assert job and job["status"] == "interrupted", job'

          sudo packaging/ubuntu/install-service.sh
          upgraded_release="$(readlink -f /opt/nmapui/current)"
          test "$upgraded_release" != "$current_release"
          test "$(readlink -f /opt/nmapui/previous)" = "$current_release"
          sudo .venv/bin/python packaging/check_release_ready.py --release "$upgraded_release" --port 9000
          sudo packaging/ubuntu/install-service.sh --rollback
          test "$(readlink -f /opt/nmapui/current)" = "$current_release"
          test "$(readlink -f /opt/nmapui/previous)" = "$upgraded_release"
          sudo .venv/bin/python packaging/check_release_ready.py --release "$current_release" --port 9000

          source_wsgi_backup="$(mktemp)"
          cp nmapui/wsgi.py "$source_wsgi_backup"
          restore_source_wsgi() {
            cp "$source_wsgi_backup" nmapui/wsgi.py
            rm -f "$source_wsgi_backup"
          }
          trap restore_source_wsgi EXIT
          cp tests/ubuntu_failed_release_wsgi.py nmapui/wsgi.py
          if sudo packaging/ubuntu/install-service.sh; then
            echo "An intentionally broken upgrade unexpectedly became ready" >&2
            exit 1
          fi
          restore_source_wsgi
          trap - EXIT
          test "$(readlink -f /opt/nmapui/current)" = "$current_release"
          test "$(readlink -f /opt/nmapui/previous)" = "$upgraded_release"
          sudo systemctl is-active --quiet nmapui.service
          sudo systemctl is-enabled --quiet nmapui.service
          sudo cmp -s /usr/local/bin/nmapui-run "$current_release/service-artifacts/nmapui-run"
          sudo cmp -s /etc/systemd/system/nmapui.service "$current_release/service-artifacts/nmapui.service"
          sudo .venv/bin/python packaging/check_release_ready.py --release "$current_release" --port 9000

          failed_rollback_wsgi_backup="$(mktemp)"
          sudo cp "$upgraded_release/nmapui/wsgi.py" "$failed_rollback_wsgi_backup"
          restore_previous_wsgi() {
            sudo install -m 0644 -o root -g root \
              "$failed_rollback_wsgi_backup" "$upgraded_release/nmapui/wsgi.py"
            rm -f "$failed_rollback_wsgi_backup"
          }
          trap restore_previous_wsgi EXIT
          sudo install -m 0644 -o root -g root \
            tests/ubuntu_failed_release_wsgi.py "$upgraded_release/nmapui/wsgi.py"
          if sudo packaging/ubuntu/install-service.sh --rollback; then
            echo "An intentionally broken rollback unexpectedly became ready" >&2
            exit 1
          fi
          restore_previous_wsgi
          trap - EXIT
          test "$(readlink -f /opt/nmapui/current)" = "$current_release"
          test "$(readlink -f /opt/nmapui/previous)" = "$upgraded_release"
          sudo systemctl is-active --quiet nmapui.service
          sudo systemctl is-enabled --quiet nmapui.service
          sudo cmp -s /usr/local/bin/nmapui-run "$current_release/service-artifacts/nmapui-run"
          sudo cmp -s /etc/systemd/system/nmapui.service "$current_release/service-artifacts/nmapui.service"
          sudo .venv/bin/python packaging/check_release_ready.py --release "$current_release" --port 9000

          sudo packaging/ubuntu/install-service.sh --uninstall
          if sudo systemctl is-active --quiet nmapui.service || sudo systemctl is-enabled --quiet nmapui.service; then
            echo "NmapUI remained active or enabled after uninstall" >&2
            exit 1
          fi
          test ! -e /etc/systemd/system/nmapui.service
          test ! -e /usr/local/bin/nmapui-run
          test ! -e /opt/nmapui/current
          sudo test -s /etc/nmapui/nmapui.env
          sudo test -f /var/lib/nmapui/runtime.sqlite3
          test -d /opt/nmapui/releases
      - name: Collect installed service failure diagnostics
        if: failure()
        run: |
          sudo systemctl status nmapui.service --no-pager || true
          sudo journalctl -u nmapui.service --no-pager -n 120 || true
          sudo tail -n 120 /var/log/nmapui/*.log || true

  packaged-smoke:
    name: Packaged App Smoke
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      NMAPUI_RUN_PACKAGED_SMOKE: "1"
      NMAPUI_SKIP_OPEN: "1"
      NMAPUI_STARTUP_TRACEROUTE: "false"
      NMAPUI_ENABLE_NETWORK_FINGERPRINT: "false"
      NMAPUI_ENABLE_UPDATE_CHECK: "false"
      NMAPUI_ENABLE_VULNERS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare scanner tools and bundled Python source environment
        run: |
          brew list nmap >/dev/null 2>&1 || brew install nmap
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run packaged smoke suite
        run: pytest -q tests/test_packaged_app_smoke.py
      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-diagnostics
          path: |
            NmapUI.app
            logs
            data
            .pytest_cache
          if-no-files-found: ignore

  native-macos:
    name: Native SwiftUI Tests And Release Bundle
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      NMAPUI_STARTUP_TRACEROUTE: "false"
      NMAPUI_ENABLE_NETWORK_FINGERPRINT: "false"
      NMAPUI_ENABLE_UPDATE_CHECK: "false"
      NMAPUI_ENABLE_VULNERS: "false"
      NMAPUI_RUN_NATIVE_BUNDLE_SMOKE: "1"
      NMAPUI_BUILD_CONFIGURATION: release
      CODESIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v5
      - name: Check out the exact shared engine for native HTTP integration
        uses: actions/checkout@v5
        with:
          repository: techmore/TM-NmapUI
          ref: 0e7d22ed8f60ea325dd6cbc77192ea9ff64340b9
          path: .shared-engine-fixture
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .shared-engine-fixture/requirements.txt
      - name: Isolate native runtime paths
        run: |
          echo "NMAPUI_DATA_DIR=$RUNNER_TEMP/nmapui-native-data" >> "$GITHUB_ENV"
          echo "NMAPUI_LOG_DIR=$RUNNER_TEMP/nmapui-native-logs" >> "$GITHUB_ENV"
          echo "NMAPUI_RUNTIME_WORKDIR=$RUNNER_TEMP/nmapui-native-work" >> "$GITHUB_ENV"
          echo "NMAPUI_NATIVE_BUILD_DIR=$RUNNER_TEMP/nmapui-native-swift-build" >> "$GITHUB_ENV"
          echo "NMAPUI_SHARED_ENGINE_SOURCE=$GITHUB_WORKSPACE/.shared-engine-fixture" >> "$GITHUB_ENV"
          echo "NMAPUI_SHARED_ENGINE_UI_ARTIFACTS=$RUNNER_TEMP/nmapui-shared-engine-ui" >> "$GITHUB_ENV"
      - name: Install native test tools
        run: |
          brew list nmap >/dev/null 2>&1 || brew install nmap
          python -m pip install pytest Flask==3.1.3
          python -m pip install -r .shared-engine-fixture/requirements.txt
          # Xcode's test runner can replace PATH; bind both fixtures to the
          # interpreter whose dependencies were installed above.
          python -c 'import os, sys; p = os.path.realpath(sys.executable); f = open(os.environ["GITHUB_ENV"], "a"); f.write(f"NMAPUI_SHARED_ENGINE_FIXTURE_PYTHON={p}\nNMAPUI_SHARED_ENGINE_CANONICAL_PYTHON={p}\n")'
      - name: Test full native Swift package
        env:
          NMAPUI_RUN_ISOLATED_KEYCHAIN_TESTS: "1"
          NMAPUI_KEYCHAIN_TEST_ENVIRONMENT: ${{ runner.environment }}
        run: swift test --package-path packaging/macos --scratch-path "$NMAPUI_NATIVE_BUILD_DIR"
      - name: Verify offline reports preserve layout and block decoy scripts
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/nmapui-native-report-browser"
          python -m playwright install chromium --only-shell
          python packaging/macos/Tests/SharedEngineCoreTests/Fixtures/check_offline_html.py "$NMAPUI_SHARED_ENGINE_UI_ARTIFACTS"
      - name: Verify numeric versions and optimized native bundle
        run: python -m pytest -q -s --basetemp "$RUNNER_TEMP/nmapui-native-pytest" tests/test_macos_bundle_version.py tests/test_native_bundle.py tests/test_macos_build_preflight.py
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-shared-scanner-evidence
          path: ${{ runner.temp }}/nmapui-shared-engine-ui
          if-no-files-found: warn
          retention-days: 14
      - name: Upload native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-diagnostics
          path: |
            ${{ runner.temp }}/nmapui-native-logs
            ${{ runner.temp }}/nmapui-native-pytest/test_real_native_bundle_*/artifacts
            .pytest_cache
          if-no-files-found: ignore
