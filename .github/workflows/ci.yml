name: CI

on:
  push:
    branches:
      - main
      - dev
      - swift-native
      - "codex/**"
  pull_request:

# One source branch shares a key across push/PR events; newer commits cancel old runs.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit And Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y xsltproc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit and contract suite
        run: pytest -q

  browser-regressions:
    name: Browser Regressions
    runs-on: ubuntu-latest
    env:
      NMAPUI_RUN_BROWSER_REGRESSION: "1"
      NMAPUI_SOCKET_AUTH_DISABLED: "1"
      NMAPUI_TRUST_LOCAL_UI: "true"
      NMAPUI_ALLOW_UNSAFE_WERKZEUG: "true"
      NMAPUI_DEBUG: "false"
      NMAPUI_ENABLE_NETWORK_FINGERPRINT: "false"
      NMAPUI_ENABLE_UPDATE_CHECK: "false"
      NMAPUI_ENABLE_VULNERS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser regression suite
        run: pytest -q tests/test_browser_regressions.py
      - name: Upload browser regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics
          path: |
            logs
            data
            .pytest_cache
          if-no-files-found: ignore

  packaged-smoke:
    name: Packaged App Smoke
    runs-on: macos-latest
    env:
      NMAPUI_RUN_PACKAGED_SMOKE: "1"
      NMAPUI_SKIP_OPEN: "1"
      NMAPUI_STARTUP_TRACEROUTE: "false"
      NMAPUI_ENABLE_NETWORK_FINGERPRINT: "false"
      NMAPUI_ENABLE_UPDATE_CHECK: "false"
      NMAPUI_ENABLE_VULNERS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare scanner tools and bundled Python source environment
        run: |
          brew list nmap >/dev/null 2>&1 || brew install nmap
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run packaged smoke suite
        run: pytest -q tests/test_packaged_app_smoke.py
      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-diagnostics
          path: |
            NmapUI.app
            logs
            data
            .pytest_cache
          if-no-files-found: ignore

  native-macos:
    name: Native SwiftUI Tests And Release Bundle
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      NMAPUI_DATA_DIR: ${{ runner.temp }}/nmapui-native-data
      NMAPUI_LOG_DIR: ${{ runner.temp }}/nmapui-native-logs
      NMAPUI_RUNTIME_WORKDIR: ${{ runner.temp }}/nmapui-native-work
      NMAPUI_STARTUP_TRACEROUTE: "false"
      NMAPUI_ENABLE_NETWORK_FINGERPRINT: "false"
      NMAPUI_ENABLE_UPDATE_CHECK: "false"
      NMAPUI_ENABLE_VULNERS: "false"
      NMAPUI_RUN_NATIVE_BUNDLE_SMOKE: "1"
      NMAPUI_BUILD_CONFIGURATION: release
      NMAPUI_NATIVE_BUILD_DIR: ${{ runner.temp }}/nmapui-native-swift-build
      CODESIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install native test tools
        run: |
          brew list nmap >/dev/null 2>&1 || brew install nmap
          python -m pip install pytest
      - name: Test full native Swift package
        run: swift test --package-path packaging/macos --scratch-path "$NMAPUI_NATIVE_BUILD_DIR"
      - name: Verify numeric versions and optimized native bundle
        run: python -m pytest -q -s --basetemp "$RUNNER_TEMP/nmapui-native-pytest" tests/test_macos_bundle_version.py tests/test_native_bundle.py
      - name: Upload native diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-diagnostics
          path: |
            ${{ runner.temp }}/nmapui-native-logs
            ${{ runner.temp }}/nmapui-native-pytest/test_real_native_bundle_*/artifacts
            .pytest_cache
          if-no-files-found: ignore
